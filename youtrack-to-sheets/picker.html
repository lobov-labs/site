<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <!-- Only this site and Google's Picker may run code here: the page holds a Google token. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.gstatic.com https://*.googleusercontent.com https://*.google.com; frame-src https://docs.google.com https://drive.google.com https://accounts.google.com https://content.googleapis.com; connect-src https://www.googleapis.com https://content.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <title>Select spreadsheet</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#111318;color:#e2e6f0;font-family:'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .state{text-align:center;padding:40px;}
    .spinner{width:36px;height:36px;border:3px solid #2d3140;border-top-color:#6c8eff;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    p{font-size:13px;color:#8b92a8;}
    .error{color:#f87171;font-size:13px;}
    .back-btn{margin-top:16px;padding:8px 18px;background:#1c1f27;border:1px solid #2d3140;border-radius:7px;color:#6c8eff;font-size:12px;font-weight:600;cursor:pointer;display:none;}
    .back-btn:hover{background:#22262f;border-color:#6c8eff;}
  </style>
</head>
<body>
<div class="state" id="state">
  <div class="spinner" id="spinner"></div>
  <p id="msg"></p>
  <button class="back-btn" id="backBtn"></button>
</div>
<script src="picker-config.js"></script>
<script src="picker.js"></script>
</body>
</html>
